name: Build Android APK

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Capacitor CLI v8 requires Node >= 22.
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Capacitor mode)
        env:
          CAPACITOR: "true"
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also publish the APK to a dedicated `apk` branch. Artifact downloads
      # go through a blob CDN that some networks can't reach; a git branch is
      # fetchable anywhere git works.
      - name: Publish APK to apk branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/apkout
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/navigate.apk
          cd /tmp/apkout
          git init -q
          git checkout -q -b apk
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add navigate.apk
          git commit -q -m "Debug APK for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk
